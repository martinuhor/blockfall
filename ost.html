<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120e14" />
    <meta name="description" content="Silent Parker soundtrack for Blockfall — play, scrub, and reorder the playlist." />
    <meta property="og:title" content="Soundtrack — Blockfall" />
    <title>Soundtrack — Blockfall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/ost.css?v=rain1" />
  </head>
  <body>
    <div class="canvas" aria-hidden="true">
      <video
        class="on backdrop"
        src="video/ost-rain-anime.mp4"
        muted
        loop
        playsinline
        autoplay
        preload="metadata"
      ></video>
      <div class="canvas-veil"></div>
    </div>
    <main>
      <header>
        <div class="mast">
          <a class="home" href="/">Home</a>
          <a href="./">Blockfall</a>
        </div>
        <p>Soundtrack</p>
      </header>
      <h1 id="title">Soundtrack</h1>
      <p id="artist">Silent Parker</p>
      <div class="seek">
        <span id="elapsed">0:00</span>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Seek" />
        <span id="duration">0:00</span>
      </div>
      <div class="transport" aria-label="Playback">
        <button type="button" id="prev">Previous</button>
        <button type="button" id="play">Play</button>
        <button type="button" id="pause">Pause</button>
        <button type="button" id="stop">Stop</button>
        <button type="button" id="next">Next</button>
      </div>
      <div class="mix">
        <label>Volume <input id="volume" type="range" min="0" max="100" value="80" /></label>
        <button type="button" id="mute">Mute</button>
      </div>
      <ol id="list" aria-label="Playlist"></ol>
    </main>
    <audio id="player" preload="metadata"></audio>
    <script type="module" src="js/ost.js?v=rain1"></script>
  </body>
</html>
