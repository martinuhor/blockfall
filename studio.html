<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#140e18" />
    <title>Studio — Blockfall</title>
    <link rel="stylesheet" href="css/game.css" />
    <style>
      .studio {
        max-width: 28rem;
        margin: 0 auto;
        padding: 24px 16px;
      }
      .studio h1 {
        font-family: Palatino, Georgia, serif;
      }
      .studio label {
        display: grid;
        gap: 6px;
        margin: 16px 0;
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 650;
      }
      .studio input {
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #1b141a;
        color: var(--ink);
      }
      .studio pre {
        padding: 12px;
        border-radius: 12px;
        background: #1b141a;
        border: 1px solid var(--line);
        overflow: auto;
        font-size: 0.8rem;
      }
      .studio .home {
        color: var(--amber);
      }
    </style>
  </head>
  <body>
    <main class="studio">
      <a class="home" href="./">Home</a>
      <p class="eyebrow">Private</p>
      <h1>Studio</h1>
      <p class="lead">Lagos-day event counts from the analytics beacon. Needs STATS_VIEW_KEY.</p>
      <label>
        View key
        <input id="key" type="password" autocomplete="current-password" />
      </label>
      <button type="button" class="primary" id="load">Load today</button>
      <p id="status" class="status" aria-live="polite"></p>
      <pre id="out">{}</pre>
    </main>
    <script type="module">
      const key = document.querySelector("#key");
      const out = document.querySelector("#out");
      const status = document.querySelector("#status");
      document.querySelector("#load").addEventListener("click", async () => {
        status.textContent = "Loading…";
        try {
          const response = await fetch("/api/stats", {
            headers: { authorization: `Bearer ${key.value}` },
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            status.textContent = payload.error || `HTTP ${response.status}`;
            return;
          }
          out.textContent = JSON.stringify(payload, null, 2);
          status.textContent = "Updated.";
        } catch {
          status.textContent = "Could not reach /api/stats.";
        }
      });
    </script>
  </body>
</html>
